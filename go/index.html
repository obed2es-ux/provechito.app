<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111311">
  <title>Abriendo Provechito…</title>
  <link rel="icon" type="image/png" href="/assets/provechito-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&amp;family=Figtree:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root { --night:#111311; --cream:#fff3d4; --muted:#a7a99f; --yellow:#ffb514; --green:#c3d338; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--cream); background:radial-gradient(circle at 20% 10%,rgba(156,172,22,.12),transparent 28%),var(--night); font:17px/1.55 "DM Sans",sans-serif; }
    main { width:min(520px,100%); text-align:center; } img { width:90px; margin:0 auto 24px; border-radius:25px; box-shadow:0 18px 40px rgba(0,0,0,.35); } h1 { margin:0; font:900 clamp(34px,8vw,54px)/.95 "Figtree",sans-serif; letter-spacing:-2px; } p { color:var(--muted); margin:20px auto; max-width:440px; } .button { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 24px; border-radius:15px; color:#121310; background:var(--yellow); font-weight:900; text-decoration:none; box-shadow:0 7px 0 #ad7310; } .small { color:var(--green); font-size:14px; font-weight:800; } [hidden] { display:none!important; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/provechito-icon.png" alt="Icono de Provechito">
    <section id="loading">
      <h1>Abriendo Provechito…</h1>
      <p>Te llevamos al App Store para descargar gratis en tu iPhone.</p>
      <p class="small">Si no se abre automáticamente, usa el botón de abajo.</p>
      <a id="continue-link" class="button" href="https://apps.apple.com/app/apple-store/id6782473761">Continuar al App Store</a>
    </section>
    <section id="fallback" hidden>
      <h1>Este enlace no está listo.</h1>
      <p>Usa la descarga oficial de Provechito para iPhone.</p>
      <a class="button" href="https://apps.apple.com/app/apple-store/id6782473761">Descargar gratis en App Store</a>
    </section>
  </main>
  <script src="/campaign-attribution.js"></script>
  <script>
    (function () {
      const result = window.ProvechitoCampaign.validateCampaignParams(window.location.search);
      const loading = document.getElementById("loading");
      const fallback = document.getElementById("fallback");
      if (!result.valid) { loading.hidden = true; fallback.hidden = false; return; }

      const destination = window.ProvechitoCampaign.buildAppStoreUrl(result.fields);
      const link = document.getElementById("continue-link");
      link.href = destination;
      const click = window.ProvechitoCampaign.buildClickPayload(result.fields, crypto.randomUUID());
      let redirected = false;
      const redirect = function () {
        if (redirected) return;
        redirected = true;
        window.location.replace(destination);
      };
      const timer = window.setTimeout(redirect, 750);

      fetch("https://api.obedstudio.dev/v1/campaign-clicks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(click),
        // Let this small request finish if navigation wins the 750 ms race.
        keepalive: true,
        credentials: "omit",
        referrerPolicy: "no-referrer"
      }).catch(function () {}).finally(function () { window.clearTimeout(timer); redirect(); });
    })();
  </script>
</body>
</html>
